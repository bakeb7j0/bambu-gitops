name: Test engine
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generic resolver
        run: python3 -m unittest discover -s tests -v
      - name: Compile tools
        run: python3 -m compileall -q tools
